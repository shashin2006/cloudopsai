services:

  postgres:
    image: postgres:16

    container_name: cloudopsai-postgres

    environment:
      POSTGRES_DB: cloudopsai
      POSTGRES_USER: cloudopsai
      POSTGRES_PASSWORD: cloudopsai_password

    ports:
      - "5433:5432"

    volumes:
      - cloudopsai-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudopsai -d cloudopsai"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cloudopsai-backend

    environment:
      DATABASE_URL: postgresql+psycopg://cloudopsai:cloudopsai_password@postgres:5432/cloudopsai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      NVIDIA_MODEL: openai/gpt-oss-20b
      NVIDIA_BASE_URL: https://integrate.api.nvidia.com/v1

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: cloudopsai-frontend

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


volumes:
  cloudopsai-postgres-data: